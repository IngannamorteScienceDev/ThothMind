pipeline:
  stage: "m5"

run:
  name: "exp_m5_xgb_walkforward_oos"
  seed: 42
  output_dir: "reports/runs"

data:
  base_path: "data"
  ticker: "SPY"
  start: null
  end: null

features:
  horizon: 1
  sma_windows: [5, 20, 50, 200]
  vol_windows: [10, 20, 60]
  lags: [1, 5, 20]

regimes:
  vol_window: 20
  vol_median_window: 252
  trend_sma_window: 200

walkforward:
  train_size: 756
  test_size: 63
  step: 63

model:
  random_state: 42
  n_estimators: 600
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  min_child_weight: 1.0

decision:
  enter_quantile: 0.70
  exit_quantile: 0.45
  edge_buffer_bps: 5.0
  min_hold_bars: 5
  cooldown_bars: 3
  trend_sma_window: 200
  use_trend_filter: true
  block_regimes: ["bear_high_vol"]
  vol_target_annual: 0.18
  vol_lookback: 20
  max_position: 1.0
  min_position: 0.0
  confidence_floor: 0.25
  confidence_cap: 1.0
  lower_bound_required: false

costs:
  commission_bps: 2.0
  slippage_k: 0.15

sim:
  initial_equity: 1.0
  execution_lag: 1
