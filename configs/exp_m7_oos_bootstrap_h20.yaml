pipeline:
  stage: "m7"

run:
  name: "exp_m7_conformal90_oos_bootstrap_vs_buyhold_h20"
  seed: 42
  output_dir: "reports/runs"

data:
  base_path: "data"
  ticker: "SPY"
  start: null
  end: null

features:
  horizon: 20
  sma_windows: [5, 20, 50, 200]
  vol_windows: [10, 20, 60]
  lags: [1, 5, 20]

regimes:
  vol_window: 20
  vol_median_window: 252
  trend_sma_window: 200

walkforward:
  train_size: 756
  test_size: 63
  step: 63

model:
  random_state: 42
  n_estimators: 600
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  min_child_weight: 1.0
  conformal_calibration_frac: 0.20

conformal:
  alpha: 0.10
  calib_size: 252
  min_calib: 126

decision:
  enter_quantile: 0.65
  exit_quantile: 0.40
  edge_buffer_bps: 5.0
  min_hold_bars: 5
  cooldown_bars: 3
  trend_sma_window: 50
  use_trend_filter: false
  block_regimes: []
  vol_target_annual: 0.18
  vol_lookback: 20
  max_position: 1.0
  min_position: 0.0
  confidence_floor: 0.25
  confidence_cap: 1.0
  lower_bound_required: true

allocation:
  low_exposure: 0.0
  mid_exposure: 0.35
  high_exposure: 1.0
  min_hold_days: 5

bootstrap:
  n_boot: 5000
  block_len: 20
  ci_alpha: 0.05
  seed: 42

costs:
  commission_bps: 2.0
  slippage_bps: 1.0
  slippage_vol_k: 10.0
  slippage_k: 0.15

sim:
  initial_equity: 1.0
  execution_lag: 1
