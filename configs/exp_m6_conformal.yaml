pipeline:
  stage: "m6"

run:
  name: "exp_m6_xgb_conformal90_walkforward_oos"
  seed: 42
  output_dir: "reports/runs"

data:
  base_path: "data"
  ticker: "SPY"
  start: null
  end: null

features:
  horizon: 1
  sma_windows: [5, 20, 50, 200]
  vol_windows: [10, 20, 60]
  lags: [1, 5, 20]

regimes:
  vol_window: 20
  vol_median_window: 252
  trend_sma_window: 200

walkforward:
  train_size: 756
  test_size: 63
  step: 63

model:
  random_state: 42
  n_estimators: 600
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  min_child_weight: 1.0

conformal:
  alpha: 0.10
  calib_size: 252
  min_calib: 126

costs:
  commission_bps: 2.0
  slippage_k: 0.15

sim:
  initial_equity: 1.0
